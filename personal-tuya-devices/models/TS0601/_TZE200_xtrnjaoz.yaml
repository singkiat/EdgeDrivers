deviceLabel: Moes Smart Curtain Motor
profiles:
  - normal_moes_smart_curtain_v1
datapoints:
  # DP 1 - EXPERIMENT: Test windowShade commands (open/close/pause) on DP 1
  - id: 1
    command: windowShade  # Standard windowShade handler for open/close/pause
    base:
      group: 1
  # DP 8 - Status reporting ONLY (position feedback from device) - no command mapping
  - id: 8
    command: windowShadeLevel  # Status reports use same handler as commands
    base:
      group: 1
  # DP 9 - Command execution - handles outgoing setShadeLevel commands  
  - id: 9
    command: windowShadeLevel  # Regular windowShadeLevel handler with transition logic
    base:
      group: 1
      rate: 100
  - id: -9
    command: windowShadePreset
    base:
      group: 1
      name: preset_position
      rate: 100